spring.application.name=marea

# Gli hosting (Render, Railway…) indicano la porta con la variabile PORT
server.port=${PORT:8080}

# Profilo attivo: dev in locale (H2 in memoria), prod con PostgreSQL vero
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JWT
jwt.secret=${JWT_SECRET:cambia-questa-chiave-in-produzione-deve-essere-lunga-e-casuale}
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# CORS: origine del frontend React (GitHub Pages)
app.cors.allowed-origin=${APP_CORS_ORIGIN:https://lauranappi.github.io}

# Promemoria push (Web Push): chiavi VAPID generate una volta sola, vedi README.
# Senza chiavi i promemoria sono spenti.
app.push.vapid-public=${VAPID_PUBLIC:}
app.push.vapid-private=${VAPID_PRIVATE:}
app.push.subject=${VAPID_SUBJECT:mailto:marea@example.com}

# Le migrazioni del database (Flyway) girano solo in produzione; in sviluppo
# e nei test lo schema viene creato da Hibernate sul database in memoria.
spring.flyway.enabled=false
