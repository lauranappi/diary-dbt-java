name: Pubblica frontend

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/pubblica.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        env:
          # Indirizzo del backend: Settings → Secrets and variables → Actions → Variables → API_URL
          VITE_API_URL: ${{ vars.API_URL }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist
      - id: deploy
        uses: actions/deploy-pages@v4
