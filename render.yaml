# Blueprint di Render: New → Blueprint, scegli questo repository.
services:
  - type: web
    name: marea-backend
    runtime: docker
    rootDir: backend
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: APP_CORS_ORIGIN
        value: https://lauranappi.github.io
      - key: DATABASE_URL        # es. jdbc:postgresql://host:5432/postgres
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: VAPID_PUBLIC        # opzionali, solo per i promemoria push
        sync: false
      - key: VAPID_PRIVATE
        sync: false
      - key: VAPID_SUBJECT
        sync: false
